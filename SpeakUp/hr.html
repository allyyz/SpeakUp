<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar" id="nav"></div>

  <div class="wrap">
    <h2 id="hello"></h2>

    <h3 class="group-title">In progress</h3>
    <div class="stats" id="open"></div>

    <h3 class="group-title">Closed</h3>
    <div class="stats" id="closed"></div>
  </div>

  <script src="app.js"></script>
  <script>
    const u = requireRole('hr');
    document.getElementById('nav').innerHTML = navHTML(u);
    if (!policyOK()) location.href = 'privacy.html';

    document.getElementById('hello').textContent = 'Welcome, ' + u.name;
    const all = allReports();
    const n = s => all.filter(r => r.status === s).length;
    const box = (label, num, cls) => `<div class="stat ${cls}"><span>${num}</span>${label}</div>`;

    document.getElementById('open').innerHTML =
      box('New', n('New'), 'c-new') +
      box('Under Review', n('Under Review'), 'c-review') +
      box('Under Investigation', n('Under Investigation'), 'c-invest');

    document.getElementById('closed').innerHTML =
      box('Resolved', n('Resolved'), 'c-resolved') +
      box('Dismissed', n('Dismissed'), 'c-dismissed') +
      box('Total Cases', all.length, 'c-total');
  </script>
</body>
</html>
